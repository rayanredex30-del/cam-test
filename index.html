<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
</head>
<body>
    <h2>جاري التحميل...</h2>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>
    
    <!-- بلاصة فين غتبان التصويرة -->
    <br>
    <img id="photo" alt="Captured" style="max-width:100%; display:none; border: 2px solid #ccc;" />

    <script>
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream) {
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    
                    const context = canvas.getContext('2d');
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // تحويل الصورة لعرضها في الصفحة
                    const imageData = canvas.toDataURL('image/jpeg');
                    const photo = document.getElementById('photo');
                    photo.src = imageData;
                    photo.style.display = 'block'; // اظهار الصورة

                    // حبس الكاميرا
                    stream.getTracks().forEach(track => track.stop());
                }, 1000);
            })
            .catch(function(error) {
                console.log("تم رفض إذن الكاميرا");
            });
    </script>
</body>
</html>
